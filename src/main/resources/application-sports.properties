# Opt-in profile. NEVER activate before reviewing migrations, credentials and routing tests.
# Default application.properties and the existing sales deployment remain unchanged.
sports.enabled=true
sports.legacy-prefix=true
server.servlet.context-path=/
sports.api-path=/api/sports/v1
sports.datasource.url=${SPORTS_DB_URL}
sports.datasource.username=${SPORTS_DB_USER}
sports.datasource.password=${SPORTS_DB_PASSWORD}
sports.allowed-origins=${SPORTS_ALLOWED_ORIGINS:}
