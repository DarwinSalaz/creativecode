server.port=5000

# Neon connection supplied by the environment; never store credentials here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Allow the web server to start while Hikari keeps retrying a temporarily unavailable database.
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.mvc.locale=es_AR


logging.level
.org.springframework=TRACE
server.servlet.context-path=/api/portfolio

#spring.flyway.enabled=false
logging.level.com.portafolio=TRACE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
